<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="abi_logo.png?v=20260525" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芯智ABI</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }

      .chat-startup-loading {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        --primary-color: #646cff;
      }

      .chat-startup-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .chat-startup-loading__logo {
        width: 128px;
        height: 128px;
        object-fit: contain;
      }

      .chat-startup-loading__spinner {
        width: 56px;
        height: 56px;
        margin: 36px 0;
      }

      .chat-startup-loading__spinner-inner {
        position: relative;
        height: 100%;
        animation: chat-startup-spin 1.2s linear infinite;
      }

      .chat-startup-loading__dot {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        background: var(--primary-color);
        animation: chat-startup-pulse 1.6s ease-in-out infinite;
      }

      .chat-startup-loading__dot:nth-child(1) {
        left: 0;
        top: 0;
      }

      .chat-startup-loading__dot:nth-child(2) {
        left: 0;
        bottom: 0;
        animation-delay: 0.5s;
      }

      .chat-startup-loading__dot:nth-child(3) {
        right: 0;
        top: 0;
        animation-delay: 1s;
      }

      .chat-startup-loading__dot:nth-child(4) {
        right: 0;
        bottom: 0;
        animation-delay: 1.5s;
      }

      .chat-startup-loading__title {
        margin: 0;
        color: #646464;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.2;
      }

      .chat-startup-error__message {
        max-width: 480px;
        margin: 16px 24px 20px;
        color: #6b7280;
        font-size: 14px;
        text-align: center;
      }

      .chat-startup-error__retry {
        min-width: 112px;
        height: 38px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--primary-color);
        cursor: pointer;
      }

      .chat-startup-route-shell {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background:
          radial-gradient(circle at 50% 42%, rgba(91, 124, 247, 0.08), transparent 34%),
          #fff;
      }

      .chat-startup-route-shell__content {
        width: min(640px, 100%);
        padding-bottom: 6vh;
        text-align: center;
      }

      .chat-startup-route-shell__title {
        margin: 0 0 12px;
        color: #202124;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .chat-startup-route-shell__subtitle {
        max-width: 640px;
        margin: 0 auto 24px;
        color: #5f6572;
        font-size: 14px;
        line-height: 1.85;
      }

      .chat-startup-route-shell__status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #8a909c;
        font-size: 12px;
      }

      .chat-startup-route-shell__status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5b7cf7;
        content: "";
        animation: chat-startup-pulse 1.6s ease-in-out infinite;
      }

      @keyframes chat-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes chat-startup-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.45;
          transform: scale(0.72);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" aria-busy="true" aria-live="polite">
      <div class="chat-startup-loading" aria-label="加载中">
        <div class="chat-startup-loading__content">
          <!-- <img class="chat-startup-loading__logo" src="home_logo.png" alt="ABI" /> -->
          <div class="chat-startup-loading__spinner">
            <div class="chat-startup-loading__spinner-inner">
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
            </div>
          </div>
          <h2 class="chat-startup-loading__title" data-chat-startup-status>正在准备对话环境...</h2>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const route = window.location.hash.replace(/^#/, "").split("?", 1)[0].replace(/\/+$/, "");
        if (route !== "/chat/task/new") return;

        const root = document.getElementById("root");
        if (!root) return;
        root.dataset.chatStartupRoute = "task-new";
        root.innerHTML = `
          <main class="chat-startup-route-shell" aria-label="新建对话正在加载">
            <div class="chat-startup-route-shell__content">
              <h1 class="chat-startup-route-shell__title">TrustABI · 芯智</h1>
              <p class="chat-startup-route-shell__subtitle">您的全能数据智能专家。从智能问数到归因预测，再到一键生成报告，芯智助您高效挖掘数据价值，精准获取商业洞察。</p>
              <span class="chat-startup-route-shell__status">正在加载对话能力</span>
            </div>
          </main>
        `;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
