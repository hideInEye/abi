<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="abi_logo.png?v=20260525" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芯智ABI</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }

      .chat-startup-loading {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        --primary-color: #646cff;
      }

      .chat-startup-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .chat-startup-loading__logo {
        width: 128px;
        height: 128px;
        object-fit: contain;
      }

      .chat-startup-loading__spinner {
        width: 56px;
        height: 56px;
        margin: 36px 0;
      }

      .chat-startup-loading__spinner-inner {
        position: relative;
        height: 100%;
        animation: chat-startup-spin 1.2s linear infinite;
      }

      .chat-startup-loading__dot {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        background: var(--primary-color);
        animation: chat-startup-pulse 1.6s ease-in-out infinite;
      }

      .chat-startup-loading__dot:nth-child(1) {
        left: 0;
        top: 0;
      }

      .chat-startup-loading__dot:nth-child(2) {
        left: 0;
        bottom: 0;
        animation-delay: 0.5s;
      }

      .chat-startup-loading__dot:nth-child(3) {
        right: 0;
        top: 0;
        animation-delay: 1s;
      }

      .chat-startup-loading__dot:nth-child(4) {
        right: 0;
        bottom: 0;
        animation-delay: 1.5s;
      }

      .chat-startup-loading__title {
        margin: 0;
        color: #646464;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.2;
      }

      @keyframes chat-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes chat-startup-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.45;
          transform: scale(0.72);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="chat-startup-loading" aria-label="加载中">
        <div class="chat-startup-loading__content">
          <!-- <img class="chat-startup-loading__logo" src="home_logo.png" alt="ABI" /> -->
          <div class="chat-startup-loading__spinner">
            <div class="chat-startup-loading__spinner-inner">
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
              <div class="chat-startup-loading__dot"></div>
            </div>
          </div>
          <h2 class="chat-startup-loading__title">正在准备对话环境...</h2>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
