<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABI 助手悬浮窗 SDK · 接入调试</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fa;
        font: 14px/1.5 sans-serif;
      }
      /* 打开按钮由宿主系统自己加（SDK 不再自带悬浮球） */
      .host-open-btn {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 2147483647;
        padding: 12px 20px;
        border: none;
        border-radius: 24px;
        cursor: pointer;
        background: linear-gradient(135deg, #5b7cf7, #8b5cf6);
        color: #fff;
        box-shadow: 0 6px 20px rgba(91, 124, 247, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- 仅 pnpm dev 使用：源码直接以 module 加载，样式随 Vite HMR 热更新；base 走 vite /api 代理 -->
    <script type="module" src="/src/index.ts"></script>

    <!-- 宿主系统自己的打开按钮 -->
    <button class="host-open-btn" id="hostOpenBtn" style="display: none">打开 AI 助手</button>

    <script>
      // dev 调试页：shareCode/base 用 URL 参数传入（?shareCode=xxx&base=/api），不写死测试值
      const params = new URLSearchParams(location.search)
      const widget = document.createElement('abi-assistant')
      widget.setAttribute('share-code', params.get('shareCode') || '')
      widget.setAttribute('base', params.get('base') || '/api')
      // theme-switch 让面板头部出现蓝/黑切换按钮
      widget.setAttribute('theme-switch', '')
      // 宿主控制显隐：面板 close 事件 -> 隐藏面板、露出自己的打开按钮；点按钮 -> 重新显示面板
      const hostOpenBtn = document.getElementById('hostOpenBtn')
      widget.addEventListener('close', () => {
        widget.style.display = 'none'
        hostOpenBtn.style.display = ''
      })
      hostOpenBtn.addEventListener('click', () => {
        widget.style.display = 'contents'
        hostOpenBtn.style.display = 'none'
      })
      document.body.appendChild(widget)
    </script>
  </body>
</html>
