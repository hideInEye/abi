<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/abi_logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>%VITE_APP_TITLE%</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
      }

      .abi-startup-loading {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4ff 0%, #eff3ff 45%, #eff2ff 100%);
      }

      .abi-startup-loading__spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(91, 124, 247, 0.14);
        border-top-color: #5b7cf7;
        border-radius: 50%;
        animation: abi-startup-spin 0.8s linear infinite;
      }

      @keyframes abi-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="abi-startup-loading" aria-label="加载中">
        <div class="abi-startup-loading__spinner"></div>
      </div>
    </div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
