<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000"/>
    <meta name="description" content="数据可视化设计器"/>
    <meta name="robots" content="index,follow">
    <meta name="author" content="xiaopujun"/>
    <meta name="keywords"
          content="light,chaser,light chaser,LIGHT,LIGHT CHASER,数据,可视化,数据可视化,大屏可视化,看板,大屏看板,数据看板,编辑器,web编辑器,web设计器,设计器,拖拽,可拖拽,可视化图表,可视化工具,追光者设计器,追光者,react大屏,react大屏设计器,react数据可视化,数字孪生">
    <title>LIGHT CHASER DESIGNER</title>
    <style>
        * {
            user-select: none;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            min-height: 100%;
        }

        .dashboard-startup-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            color: #59657a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6fb;
        }

        .dashboard-startup-shell__spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #dfe5f1;
            border-top-color: #4f7cff;
            border-radius: 50%;
            animation: dashboard-startup-spin 0.9s linear infinite;
        }

        .dashboard-startup-shell__title {
            margin: 18px 0 0;
            font-size: 16px;
            font-weight: 500;
        }

        .dashboard-startup-shell__message {
            max-width: 480px;
            margin: 12px 24px 20px;
            text-align: center;
        }

        .dashboard-startup-shell__retry {
            min-width: 112px;
            height: 38px;
            padding: 0 20px;
            border: 0;
            border-radius: 6px;
            color: #fff;
            background: #4f7cff;
            cursor: pointer;
        }

        @keyframes dashboard-startup-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body style="padding: 0;margin: 0">
<div id="root" aria-busy="true" aria-live="polite">
    <div class="dashboard-startup-shell" role="status">
        <div class="dashboard-startup-shell__spinner" aria-hidden="true"></div>
        <p class="dashboard-startup-shell__title">正在准备大屏应用...</p>
    </div>
</div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
