server {
  listen 80;
 # listen 443 ssl ;
 # server_name hr.workai.com.cn;
 # ssl_certificate "/home/hro-company-nginx/nginx-cert/workai.com.cn.pem";
 # ssl_certificate_key "/home/hro-company-nginx/nginx-cert/workai.com.cn.key";
 # ssl_session_timeout 5m;
 # ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
 # ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
 # ssl_prefer_server_ciphers on;
  root /home/hro-company-nginx/web-site/master;
  location / {
    try_files $uri $uri/ /index.html;
    index index.html index.htm;
  }

  location /api/ {
    proxy_pass http://express:8866;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /web/ {
    proxy_pass http://web:9100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

}
 
