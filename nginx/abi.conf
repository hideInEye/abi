server {
  listen 80;
  server_name localhost;
  location /chat-ui/ {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' '*';
    add_header 'Access-Control-Allow-Methods' '*';
    add_header Access-Control-Allow-Credentials true;
    add_header Vary Origin;
    add_header Vary Access-Control-Request-Method;
    add_header Vary Access-Control-Request-Headers;
    add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With,content-type';
    add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
    proxy_pass http://127.0.0.1:9100/;
  }
  # 主应用 abi
  location / {
    root   /usr/share/nginx/html/abi;
    index  index.html;
    try_files $uri $uri/ /index.html;
  }

  location /chat-proxy/ {
    proxy_pass http://192.168.1.196:9080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://192.168.1.196:9080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
