version: "3.9"

services:
  web:
    image: xd
    container_name: web-nginx
    restart: always
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - monorepo_net
    # 如果你想在服务器上单独替换 nginx 配置，可启用下面的 volume
    # volumes:
    #   - /opt/monorepo/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  monorepo_net:
    driver: bridge
